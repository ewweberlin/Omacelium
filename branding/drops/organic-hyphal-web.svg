<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Organic hyphal web, drop 2, 2026-10-20. Curved tapering hyphae with an
       anastomosis loop (hyphae fusing back together) — the signature
       mycelium-network shape. Palette: loam bark #241E2E, pale beige
       #E7DCC8, amber #F2A33C. -->
  <rect width="64" height="64" rx="12" fill="#241E2E"/>
  <!-- capillary offshoots (thin) -->
  <g stroke="#E7DCC8" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M9.8 24.5 C 9.2 22, 8.2 20, 7 18.5"/>
    <path d="M33.2 20.5 C 35.5 19, 38 18.5, 40.5 19"/>
    <path d="M51.5 17.5 C 52.5 15.5, 52.5 13.5, 51.8 11.5"/>
  </g>
  <!-- main hyphae (thick, curved forks) -->
  <g stroke="#E7DCC8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M32 56 C 31 50.5, 29.5 46, 27 41.5 C 23.5 35.5, 18 31, 12.5 27 C 10 25.2, 8.3 23.5, 7 21.5"/>
    <path d="M27 41.5 C 27 36.5, 28.5 31.5, 30.5 27 C 32.5 22.5, 35 18.5, 36 14"/>
    <path d="M29.5 43.5 C 35 43, 40.5 40.5, 45 36 C 49 32, 51 27, 52 22"/>
    <!-- anastomosis loop: hyphae fusing back together -->
    <path d="M36 14 C 36.5 17.5, 38 21, 40.5 24.5 C 42.5 27, 45 29.5, 47.5 31.5 C 49.3 32.9, 50.8 34.2, 52 36"/>
    <path d="M48.5 34 C 47 31.5, 45 29.5, 42.5 27.5"/>
  </g>
  <!-- spores at tips -->
  <circle cx="7" cy="21.5" r="3.4" fill="#F2A33C"/>
  <circle cx="36" cy="14" r="3" fill="#F2A33C"/>
  <circle cx="52" cy="22" r="3.4" fill="#F2A33C"/>
  <circle cx="7" cy="18.5" r="2" fill="#F2A33C"/>
  <circle cx="40.5" cy="19" r="2.2" fill="#F2A33C"/>
  <circle cx="51.8" cy="11.5" r="2.1" fill="#F2A33C"/>
  <circle cx="47.7" cy="32" r="2.4" fill="#F2A33C"/>
  <!-- organic base node: irregular blob -->
  <path d="M28.2 51 C 27.5 48.6 28.4 46.8 30.4 46.1 C 32.8 45.3 35.2 46.2 36 48.2 C 36.9 50.3 35.7 52.3 33.5 53.1 C 31.4 53.8 28.9 53.2 28.2 51 Z" fill="#F2A33C"/>
</svg>
